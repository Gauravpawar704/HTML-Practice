<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transition</title>
    <style>
        #box {
            display: flex;
            width: 200px;
            height: 200px;
            background-color: rgb(243, 221, 193);
            justify-content: center;
            align-items: center;
            /* transition-property: background-color; */
            /* transition-duration: 1s; */
            /* transition-timing-function: ease-in-out; */
            /* transition-delay: 2s; */
            transition: background-color 1s ease-in-out 2s;

            transition: all 1s ease-in-out 2s;
        }

        #box:hover {
            background-color: rgb(110, 168, 219);
            width: 300px;
            height: 300px;
            border-radius: 100px;
            font-size: 25px;
            /* font-family: cursive; */
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h3>This is CSS Transition tutorial</h3>
    <div class="conatiner">
        <div id="box">
            this is my box
        </div>
    </div>
</body>

</html>
