<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javacript Date and time </title>
    <style>
        body {
            background-color: #eb6637;
        }

        .container {
            font-size: 23px;
            background: rgba(255, 255, 255, 0.12);
            text-align: center;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 34px;
            margin: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        #time {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        This is a current time.<span id="time"></span>
    </div>
    <script>
        console.log("This is date and time ");
        let now = new Date();
        console.log(now);

        let dt = new Date(0);
        console.log(dt);

        let newDate = new Date("2026-08-31");
        console.log(newDate);

        // let NewDate= new Date(year,month,date,hours,minutes,seconds,millisecond);
        // let NewDate = new Date(2026, 9, 6, 9, 3, 2, 34);
        // console.log(NewDate);

        let yr = newDate.getFullYear();
        console.log("This year is", yr);

        let dt1 = newDate.getDate();
        console.log("This date is", dt1);

        let mon = newDate.getMonth();
        console.log("This month is", mon);

        let hr = newDate.getHours();
        console.log("This hours is", hr);

        let day = newDate.getDay();
        console.log("The day is", day);

        newDate.setDate(6);
        console.log(newDate);
        newDate.setMinutes(60);
        console.log(newDate);

        setInterval(updateTime, 1000);

        function updateTime() {
            time.innerHTML = new Date;
        }
    </script>
</body>

</html>
