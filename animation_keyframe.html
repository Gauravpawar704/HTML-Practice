<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation and Keyframe</title>
    <style>
        .container {
            /* display: flex; */
            background-color: greenyellow;
        }

        .box {
            background-color: rgb(156, 201, 90);
            width: 250px;
            height: 250px;
            position: relative;
            animation-name: gaurav2;
            animation-duration: 8s;
            animation-iteration-count: infinite;
            animation-fill-mode: alternate;
            /* animation-direction: reverse; */
        }

        @keyframes gaurav2 {
            0% {
                top: 0px;
                left: 0px;
            }

            25% {
                top: 250px;
                left: 0px;
            }

            75% {
                top: 250px;
                left: 250px;
            }

            100% {
                top: 0px;
                left: 250px;
            }
        }

        @keyframes gaurav1 {
            from {
                width: 200px;
            }

            to {
                width: 400px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            This is box
        </div>
    </div>
</body>

</html>
