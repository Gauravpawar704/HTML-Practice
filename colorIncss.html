<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Colors</title>
    <style>
        #firstpara {
            color: blueviolet;
                  background-color: #60dca4;
        }

        #secpara {
            color: rgb(45, 145, 212);
            border: 2px solid rgb(223, 143, 45);
        }

        #thirdpara {
            color: #60dca4;
            background-color: blueviolet;
        }
    </style>
</head>

<body>
    <h2>This is my first box</h2>
    <p id="firstpara">This is paragraph of my first box</p>
    <p id="secpara">This is paragraph of my second box</p>
    <p id="thirdpara">This is paragraph of my third box</p>
</body>

</html>
