<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Font</title>
    <style>
        p {
            font-family:'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 30px;
            line-height: 1.2em;
            font-weight: bold;
        }

        span {
            font-family: italic;
            font-style: oblique;
        }

        #para {
            font-family: fantasy;
            font-size: 20px;
            font-weight: lighter;
        }
    </style>
</head>

<body>
    <h2>CSS Fonts</h2>
    <p>Lets paly with <span><u>fonts</u></span>.It is very exciting</p>
    <p id="para"><u>Gaurav Sunil Pawar</u></p>
</body>

</html>
