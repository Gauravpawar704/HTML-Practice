<!DOCTYPE html>

<head>
    <title>CSS Selector</title>
    <style>
        /* Element selector */
        p {
            border: 2px solid rebeccapurple;
        }

        /* Id selector */
        #firstPara {
            color: rgb(250, 99, 12);
        }

        /* Class selector */
        .secpara {
            color: rgb(43, 8, 240);
        }

        /* Grouping selector */
        footer,
        span {
            background-color: rgb(37, 240, 247);
        }
    </style>
</head>

<body>
    <h3>CSS Selector</h3>
    <p id="firstPara">This is a simple paragraph to demostarte css selector</p>
    <p id="secpare" class="redElement secpara">This is another simple paragraph to demostarte</p>
    <div>
        <p>This is yet another simple paragraph to demostarte</p>
    </div>
    <span>This is span</span>
    <br>
    <footer>This is a footer</footer>
</body>

</html>
