<!DOCTYPE html>
<html lang="en">
<head>
    <title>Border and back ground</title>
    <style>
        #firstPara{
            background-color: #60dca4 ;
            height: 40px;
            width: 455px;
            border: 3px solid rgb(16, 202, 202);
            /* border-width: 3px;
            border-color: rgb(16, 202, 202);     
            border-style: solid; */
            border-radius: 10px;
         }

         #secpara{
              background-color: #60dca4 ;
            height: 40px;
            width: 455px;
           border-top: 2px solid violet;
           border-bottom: 2px solid rgb(63, 5, 63);
           border-top-left-radius: 10px;
           border-bottom-right-radius: 10px;
         }

         #thpara{
            color: orangered;
            border: 4px solid orangered;
          height: 400px;
            width: 215px;
            background-image: url('1000009193.jpg');

            background-repeat: no-repeat; /* repeat-x and repeat-y will make it repeat on x and y axis */
         }

    </style>
</head>
<body>
    <h2>This is heading</h2>
    <!-- &nbsp is use to give space bcz html does not give space by default -->
    <p id="firstPara">&nbsp This is a paragraph</p>
    <h2>This is second heading</h2>
    <p id="secpara">&nbsp This is my second paragraph</p>
    <h2>This is third heading</h2>
    <p id="thpara">&nbsp He is shree lord ganesha </p>
</body>
</html>
