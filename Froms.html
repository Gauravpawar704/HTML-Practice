<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h2>This is HTML forms tutorial</h2>
    <form action="new1.txt">
        <label for="myName">Name:</label>
        <div>
            <input type="myName" id="myName">
        </div>
        <br>
        <label for="myRole">Role:</label>
        <div>
            <input type="myRole" id="myRole">
        </div>
        <br>
        <label for="myEmail">Email</label>
        <div>
            <input type="email" name="myEmail" id="myEmail">
        </div>
        <br>
        <label for="myDate">Date:</label>
        <div>
            <input type="date" id="myDate">
        </div>
        <br>
        <div>
            Are you eligible? <input type="checkbox" name="myCheckbox">
        </div>
        <br>
        <div>
            Gender: Female<input type="radio" name="myGender"> Male<input type="radio" name="myGender">
        </div>

        <br>
        <div>
            Write about your self:<br> <textarea name="myText" id="" cols="30" rows="10"></textarea>
        </div>
        <br>
        <div>
            <label for="car">Car:</label>
            <select name="myCar" id="car">
                <option value="ind">Indica</option>
                <option value="swf">Swift</option>
            </select>
        </div>
        <br>
        <div>
            <input type="submit" value="Sumbit Now">
            <input type="reset" value="Reset Now">
        </div>

    </form>
</body>

</html>
