<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <STYle>
        * {
            margin: 0;
            padding: 0;
        }

        .contact {
            padding: 40px 20px;
            background-color: rgb(202, 202, 67);
        }

        .contact form {
            width: 50%;
            margin: 0 auto;
            background: #f5f5f5;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .contact label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .contact small {
            display: block;
            margin-bottom: 20px;
        }

        .contact input,
        .contact textarea {
            padding: 12px;
            width: 100%;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            font-weight: 18px;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .contact textarea {
            resize: vertical;
        }

        .contact h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .btn1{
            display: block;
            margin: 0 auto;
            padding: 12px 30px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
    </STYle>
</head>

<body>
    <section class="contact">
        <H1>FORM APPLICATION </H1>
        <form action="" novalidate>
            <label for="Name">Enter Name: </label>
            <input type="text" id="Name" placeholder="Enter your full Name">
            <small id="nameError"></small><br>

            <label for="email">Enter email</label>
            <input type="email" id="email" placeholder="Enter your email">
            <small id="emailError"></small><br>

            <label for="Sub">Subject: </label>
            <input type="text" id="Sub" placeholder="Enter subject">
            <small id="subError"></small><br>

            <label for="message">Enter message: </label>
            <textarea name="msg" rows="6" id="message"></textarea>
            <small id="messageError"></small><br>
            <button class="btn1" type="submit">Send message</button>
        </form>
    </section>
    <script src="chatgpt_js.js"></script>
</body>

</html>
