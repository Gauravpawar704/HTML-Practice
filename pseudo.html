<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Style link and button</title>
    <style>
        .container{
            border: 3px solid rgb(110 151 110);
            background-color: rgb(174 221 174);
            padding: 34px;
            margin: 34px auto;
            width: 666px;
            /* border-top-left-radius: 10px ;
            border-top-right-radius: 10px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px; */
            border-radius: 10px;
        }
        a{
            text-decoration: none;
            color: rgb(7, 15, 9);
        }
        a:hover{
            color: rgb(243, 240, 255);
            background-color: rgb(24, 238, 113);
        }
        a:visited{
            background-color: rgb(79, 243, 175);
        }
        a:active{
            background-color: rgb(86, 187, 137);
        }
        .btn{
            font-family:cursive;
            background-color: rgb(76, 134, 94);
            padding: 6px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 12px;
            border-radius: 5px;
        }
        .btn:hover{
            color: rgb(112, 206, 154);
            background-color: rgb(215, 250, 163);
            border: 3px solid rgb(89, 226, 25);
        }
    </style>
</head>
<body>
    <div class="container" id="cont1">
        <h2>This is my heading</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Vel, doloremque fugit ex fuga eum, enim ipsa quos ut rerum quasi laudantium nostrum. Commodi id iure excepturi, voluptatum sit atque maxime distinctio quidem mollitia optio.</p>
        <a href="https://google.com" class="btn">Readmore</a>
        <button class="btn">Contact us</button>
    </div>
    
</body>
</html>
