<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Variables/Custom Properties</title>
    <style>
        :root {
            --primary-color: rgb(201, 90, 201);
            --danger-color: rgb(110, 9, 110);
            --maxw: 333px;
        }

        .box {
            --box-color: rgb(233, 177, 228);

            width: 200px;
            height: 200px;
            background-color: var(--box-color);
            border: 2px solid rgb(233, 165, 233);
            margin: 2px 9px;
            /* box-shadow: 2px 3px var(--box-color); */
        }

        .container {
            display: flex;
            margin: auto;
            width: var(--maxw);
            background-color: var(--danger-color);
            color: var(--primary-color);
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">This is css vaiable</div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
