<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEX BOX</title>
    <style>
        .container {
            height: 500px;
            width: 100%;
            border: 2px solid black;
            display: flex;
            /* Initialize the conatiner as flex box */

            /* Flex porperties for flex container */

            /* flex-direction: row;  Default value of flex-direction is row */
            /* flex-direction: column;
            flex-direction: row-reverse;
            flex-direction: column-reverse; */
            /* flex-wrap: wrap;   Default value of flex-direction is no wrap*/

            /* flex-wrap: wrap-reverse; */

            /* (this is short hand for flex direction and flex wrap) */
            /* flex-flow: row-reverse wrap; */


            /* justify-content: will justify the content in horizontal direction; */
            /* justify-content:right; */
            /* justify-content: center; */
            /* justify-content: space-between; */
            /* justify-content: space-evenly; */

            /* justify-content: will justify the content in vertical direction; */
            /* align-items: center; */
            /* align-items: flex-end; */
            /* align-items: flex-start; */
            /* align-items: stretch; */
        }

        .item {
            width: 200px;
            height: 200px;
            background-color: tomato;
            border: 2px solid red;
            margin: 10px;
            padding: 2px;
        }

        #item1 {
            /* flex property for item */
            /* higher the orser,later it show in container */
            /* order: 2; */
            align-self: flex-end;
            /* flex-grow: 2;
            flex-shrink: 2; */
        }

        #item2 {
            /* flex-grow: 3; */
            /* order: 10; */
            flex-basis: 120px;
            /* when flex-direction is not set to row flex basis will control width; */
            /* when flex-direction is not set to column flex basis will control height; */
        }

        #item3 {
            flex: 2 2 230px;
            /* flex-shrink: 3; */
            /* order: 5; */
            align-self: flex-start;
        }
    </style>
</head>

<body>
    <h3>This is Flex box tutorial</h3>
    <div class="container">
        <div class="item" id="item1">First Box</div>
        <div class="item" id="item2">Second Box</div>
        <div class="item" id="item3">Third Box</div>
        <!-- <div class="item" id="item4">Fourth Box</div>
        <div class="item" id="item5">Fifth Box</div>
        <div class="item" id="item6">Sixth Box</div> -->
    </div>
</body>

</html>
